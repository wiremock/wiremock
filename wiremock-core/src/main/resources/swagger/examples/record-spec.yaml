targetBaseUrl: http://example.mocklab.io
filters:
  urlPathPattern: "/api/.*"
  method: GET
captureAllHeaders: true
excludeHeaders:
  - Host
  - Content-Length
  - Connection
captureHeaders:
  Accept: {}
  Content-Type:
    caseInsensitive: true
requestBodyPattern:
  matcher: equalToJson
  ignoreArrayOrder: false
  ignoreExtraElements: true
extractBodyCriteria:
  textSizeThreshold: '2048'
  binarySizeThreshold: '10240'
persist: false
repeatsAsScenarios: false
transformers:
  - modify-response-header
transformerParameters:
  headerValue: '123'