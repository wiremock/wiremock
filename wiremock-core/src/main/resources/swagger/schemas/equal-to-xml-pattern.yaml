title: XML equality
type: object
properties:
  equalToXml:
    type: string
    x-intellij-language-injection: XML
    example: |-
      <amount>123</amount>
  enablePlaceholders:
    type: boolean
  placeholderOpeningDelimiterRegex:
    type: string
    example: "\\["
    x-intellij-language-injection: RegExp
  placeholderClosingDelimiterRegex:
    type: string
    example: "]"
    x-intellij-language-injection: RegExp
  namespaceAwareness:
    type: string
    enum: ['LEGACY', 'STRICT', 'NONE']

required:
  - equalToXml
